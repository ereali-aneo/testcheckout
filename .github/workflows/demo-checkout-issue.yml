name: Demo - Checkout Configurations for Fork PRs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # OLD CONFIG from PR #1119 - BREAKS FOR FORKS
  checkout-old-config:
    name: "OLD: github.head_ref || github.ref (BREAKS FORKS)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout with old config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Show checked out ref info
        run: |
          echo "=== OLD CONFIG: ref: github.head_ref || github.ref ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "github.repository: ${{ github.repository }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo ""
          echo "Git remote:"
          git remote -v
          echo ""
          echo "Current git branch:"
          git branch -a
          echo ""
          echo "Current git commit:"
          git log -1 --oneline
          echo ""
          echo "Git status:"
          git status

  # NEW CONFIG - FIXES FORKS with empty string
  checkout-new-config:
    name: "NEW: event_name check with '' (FIXES FORKS)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with new config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && '' || github.ref }}

      - name: Show checked out ref info
        run: |
          echo "=== NEW CONFIG: ref: event_name == 'pull_request' && '' || github.ref ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "github.repository: ${{ github.repository }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo "github.event.pull_request.merge_commit_sha: ${{ github.event.pull_request.merge_commit_sha }}"
          echo ""
          echo "Git remote:"
          git remote -v
          echo ""
          echo "Current git branch:"
          git branch -a
          echo ""
          echo "Current git commit:"
          git log -1 --oneline
          echo ""
          echo "Git status:"
          git status

  # VERSIONNING CONFIG - Uses merge_commit_sha explicitly
  checkout-versionning-config:
    name: "VERSIONNING: merge_commit_sha explicit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with versionning config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - name: Show checked out ref info
        run: |
          echo "=== VERSIONNING CONFIG: ref: merge_commit_sha explicit ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "github.repository: ${{ github.repository }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.head_ref: ${{ github.head_ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo "github.event.pull_request.merge_commit_sha: ${{ github.event.pull_request.merge_commit_sha }}"
          echo "github.event.pull_request.head.sha: ${{ github.event.pull_request.head.sha }}"
          echo ""
          echo "Git remote:"
          git remote -v
          echo ""
          echo "Current git branch:"
          git branch -a
          echo ""
          echo "Current git commit:"
          git log -1 --oneline
          echo ""
          echo "Git status:"
          git status
          echo ""
          echo "Full history (last 5 commits):"
          git log --oneline -5

  # This job explains the differences
  explain-differences:
    name: "Explanation"
    runs-on: ubuntu-latest
    needs: [checkout-old-config, checkout-new-config, checkout-versionning-config]
    if: always()
    steps:
      - name: Explain the results
        run: |
          cat << 'EOF'
          ================================================================
          DEMONSTRATION RESULTS - Fork PR Checkout Configurations
          ================================================================

          Event Type: ${{ github.event_name }}
          Repository: ${{ github.repository }}

          THE PROBLEM WITH FORKS:
          -----------------------
          When a PR comes from a fork (e.g., CACIB-ArmoniK-Admin/ArmoniK.Core → aneoconsulting/ArmoniK.Core):
          1. GitHub Actions clones the BASE repository (aneoconsulting/ArmoniK.Core)
          2. The branch from the fork (e.g., "ia/fix-handle-crash") does NOT exist in the base repo
          3. Using github.head_ref fails with "branch could not be found"

          OLD CONFIG (PR #1119) - BREAKS FOR FORKS:
          ------------------------------------------
          ref: ${{ github.head_ref || github.ref }}

          ❌ For fork PRs:
             - github.head_ref = "ia/fix-handle-crash"
             - Tries to checkout this branch name
             - FAILS: branch only exists in fork, not in base repo

          ✅ For same-repo PRs: Works fine

          NEW CONFIG - FIXES FORKS:
          -------------------------
          ref: ${{ github.event_name == 'pull_request' && '' || github.ref }}

          ✅ For ALL PRs (fork or same-repo):
             - Empty string triggers default checkout behavior
             - Checks out the merge commit created by GitHub
             - Works because GitHub creates merge commits for all PRs

          ✅ For push events:
             - Uses github.ref (the pushed branch)

          VERSIONNING CONFIG - EXPLICIT MERGE COMMIT:
          -------------------------------------------
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}

          ✅ For ALL PRs:
             - Explicitly uses the merge commit SHA
             - Same result as empty string, but more explicit
             - Ensures codacy/git-version has full context

          ✅ For push events:
             - Uses github.ref

          REPOSITORY CLONED:
          ------------------
          In ALL cases, the repository cloned is the BASE repository (github.repository).
          The difference is WHAT REF is checked out from that repository.

          RECOMMENDATION FOR ARMONIK.CORE:
          ---------------------------------
          ✅ GOOD (for most jobs):
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event_name == 'pull_request' && '' || github.ref }}

          ✅ GOOD (for versionning job):
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
                fetch-depth: 0

          ❌ BAD (breaks forks):
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.head_ref || github.ref }}
          ================================================================
          EOF
