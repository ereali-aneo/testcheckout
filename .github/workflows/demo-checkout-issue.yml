name: Demo - Checkout Issue with ref

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # This job uses ref: ${{ github.ref }} (PROBLEMATIC for PRs)
  checkout-with-explicit-ref:
    name: "Checkout WITH ref (problematic)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with explicit ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Show checked out ref info
        run: |
          echo "=== Checkout WITH ref: \${{ github.ref }} ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo ""
          echo "Current git branch:"
          git branch -a
          echo ""
          echo "Current git commit:"
          git log -1 --oneline
          echo ""
          echo "Git status:"
          git status

  # This job does NOT use ref (CORRECT - lets GitHub Actions decide)
  checkout-without-ref:
    name: "Checkout WITHOUT ref (correct)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without explicit ref
        uses: actions/checkout@v4

      - name: Show checked out ref info
        run: |
          echo "=== Checkout WITHOUT ref (default behavior) ==="
          echo "GitHub Event: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.sha: ${{ github.sha }}"
          echo ""
          echo "Current git branch:"
          git branch -a
          echo ""
          echo "Current git commit:"
          git log -1 --oneline
          echo ""
          echo "Git status:"
          git status

  # This job explains the differences
  explain-differences:
    name: "Explanation"
    runs-on: ubuntu-latest
    needs: [checkout-with-explicit-ref, checkout-without-ref]
    if: always()
    steps:
      - name: Explain the issue
        run: |
          cat << 'EOF'
          ================================================================
          DEMONSTRATION RESULTS
          ================================================================

          Event Type: ${{ github.event_name }}

          FOR PUSH EVENTS:
          ----------------
          Both methods work because github.ref points to the pushed branch.

          FOR PULL_REQUEST EVENTS:
          -------------------------
          WITH ref: ${{ github.ref }}
            - github.ref = "refs/pull/X/merge"
            - May checkout incorrect code or fail
            - Does not work correctly for fork PRs

          WITHOUT ref (default):
            - GitHub Actions automatically checks out the merge commit
            - Correctly merges PR code with base branch
            - Works for both internal and fork PRs

          RECOMMENDATION:
          ---------------
          REMOVE "ref: ${{ github.ref }}" from all checkout actions!
          Let GitHub Actions handle the ref automatically.

          Good:
            - uses: actions/checkout@v4

          Bad:
            - uses: actions/checkout@v4
              with:
                ref: ${{ github.ref }}
          ================================================================
          EOF
